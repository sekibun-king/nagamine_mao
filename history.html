<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV — 長峰実央</title>

<style>
:root{
  --brand:#e60033;
  --brand-d:#cc002d;
  --ink:#222;
  --muted:#666;
  --line:#e8e8e8;
  --bg:#f6f7f8;
  --card:#fff;
  --soft:#fff5f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.65 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 14px}

/* header */
header.site{
  position:sticky;
  top:0;
  z-index:60;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.header-inner{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  color:var(--brand);
  white-space:nowrap;
}
.logo-mark{
  width:24px;
  height:24px;
  border-radius:6px;
  background:linear-gradient(135deg,#ff4a6e,var(--brand));
}
.actions{
  margin-left:auto;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  min-height:34px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:#222;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
.btn:hover{border-color:#cfcfcf}
.btn.primary{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}
.btn.primary:hover{background:var(--brand-d)}

/* main */
main.container{margin:16px auto 24px}
.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.page-head h1{
  margin:0;
  font-size:1.35rem;
  line-height:1.35;
}
.last-update{
  color:var(--muted);
  font-size:.88rem;
}

/* search */
.search-row{
  margin:0 0 18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.search-row input{
  flex:1;
  height:40px;
  min-width:220px;
  border-radius:999px;
  border:1px solid var(--line);
  padding:0 14px;
  background:#fff;
}
.search-row button{
  height:40px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  padding:0 14px;
  cursor:pointer;
}
.search-row .btn-search{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

/* sections */
section+section{margin-top:26px}
h2{
  margin:0 0 8px;
  font-size:1.05rem;
  font-weight:900;
}

/* tables */
.table-wrap{
  border-radius:10px;
  background:#fff;
  border:1px solid var(--line);
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
table.list{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
  font-size:.86rem;
}
table.list th,
table.list td{
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
table.list th{
  background:#fafafa;
  color:var(--muted);
  white-space:nowrap;
  text-align:left;
}
table.list tbody tr:last-child td{border-bottom:0}
table.list tbody tr.data-row:hover{background:#fff8fb}

td.col-date{width:130px;white-space:nowrap}
td.col-role{width:110px}
td.col-venue{width:180px}
td.col-loc{width:160px}
td.col-title{width:360px}

.preserve-break{
  white-space:pre-line;
  word-break:break-word;
}
.empty-cell{
  padding:12px;
  color:var(--muted);
}
.link-title{
  color:#111;
  text-decoration:underline;
  text-decoration-color:#bbb;
  text-underline-offset:2px;
}
.link-title:hover{
  color:var(--brand);
  text-decoration-color:var(--brand);
}

/* papers */
.paper-title-line{
  display:flex;
  align-items:flex-start;
  gap:7px;
  flex-wrap:wrap;
}
.paper-status{
  display:inline-flex;
  align-items:center;
  min-height:21px;
  padding:1px 7px;
  border-radius:999px;
  border:1px solid #ffd0da;
  background:var(--soft);
  color:var(--brand);
  font-size:.76rem;
  font-weight:700;
  white-space:nowrap;
}
.paper-source-link{
  margin-left:5px;
  color:var(--muted);
  font-size:.78rem;
  text-decoration:underline;
  text-underline-offset:2px;
}
.paper-source-link:hover{color:var(--brand)}

/* status/error */
.page-status{
  display:none;
  margin:0 0 12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--muted);
}
.page-status.show{display:block}
.page-status.error{
  color:#9b001d;
  border-color:#f0c7d0;
  background:#fff5f7;
}

/* footer */
footer{

  background:#fff;
  border-top:1px solid var(--line);
}
.footer-links{

  display:flex;
  gap:10px;

.footer-links a:hover{color:var(--brand)}
.sep{color:#bbb}

<script>
/* ==============================
   Google Sheets CMS
   history シートに以下の列を追加すると comments.html に反映されます:
   authors / status / comment / arxiv / doi
============================== */

const SPREADSHEET_ID = "1uV2Rdpa86KHv92NxBBcDZY1UI0V8dScUHtMbWanX2ks";
const SHEET_NAME = "history";
const SHEET_URL = `https://opensheet.elk.sh/${SPREADSHEET_ID}/${encodeURIComponent(SHEET_NAME)}`;

let DATA = [];

/* ---------- utility ---------- */

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function safeUrl(value){
  const raw = String(value ?? "").trim();
  if(!raw) return "";
  try{
    const u = new URL(raw, location.href);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : "";
  }catch(_){
    return "";
  }
}

function periodOf(x){
  const start = String(x.start || "").trim();
  const end = String(x.end || "").trim();
  if(start || end) return `${start}〜${end || "現在"}`;
  return String(x.date || "").trim();
}

function externalLink(url, label, cls=""){
  const href = safeUrl(url);
  if(!href) return "";
  return `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
}

/* ---------- data ---------- */

async function load(){
  if(DATA.length) return DATA;

  const status = document.getElementById("page-status");
  status.textContent = "データを読み込んでいます…";
  status.className = "page-status show";

  const res = await fetch(SHEET_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("CVデータの取得に失敗しました");

  DATA = await res.json();

  status.textContent = "";
  status.className = "page-status";
  return DATA;
}

/* ---------- search ---------- */

function doSearch(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  sessionStorage.setItem("hist_q", q);
  render();
}

function clearSearch(){
  sessionStorage.removeItem("hist_q");
  document.getElementById("q").value = "";
  render();
}

function filter(list){
  const q = (sessionStorage.getItem("hist_q") || "").trim().toLowerCase();
  if(!q) return list;

  return list.filter(x =>
    Object.values(x || {}).some(v =>
      String(v ?? "").toLowerCase().includes(q)
    )
  );
}

/* Enter でも検索 */
document.getElementById("q").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    doSearch();
  }
});

/* ---------- row builders ---------- */

function rowEdu(x){
  return `
    <tr class="data-row">
      <td class="col-date">${esc(periodOf(x))}</td>
      <td>${esc(x.school || x.title || "")}</td>
    </tr>`;
}

function rowCar(x){
  return `
    <tr class="data-row">
      <td class="col-date">${esc(periodOf(x))}</td>
      <td>${esc(x.title || "")}</td>
    </tr>`;
}

function rowPaper(x,n){
  const title = esc(x.title || "");
  const status = String(x.status || "").trim();
  const sourceUrl = safeUrl(x.url);
  const key = String(x.id || x.title || "").trim();

  const commentHref = key
    ? `comments.html?id=${encodeURIComponent(key)}`
    : "comments.html";

  return `
    <tr class="data-row">
      <td>${n}</td>

      <td>

/* ---------- automatic last update ---------- */

async function setLastUpdate(){
  const box = document.getElementById("last-update");
  if(!box) return;

  const META_URL = "https://opensheet.elk.sh/1uV2Rdpa86KHv92NxBBcDZY1UI0V8dScUHtMbWanX2ks/meta";
  const PAGE_FILE = "history.html";
  const TARGET_NAMES = ["history"];
  const TARGET_GIDS = [];
  const USE_SITE_FALLBACK = false;

  function parseMetaDate(row){
    const ms = Number(row?.updated_ms);
    if(Number.isFinite(ms) && ms > 0) return new Date(ms);

    const raw = String(row?.updated || "").trim();
    if(!raw) return null;
    const d = new Date(raw);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatJST(date){
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone:"Asia/Tokyo",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }).formatToParts(date);

    const v = type => parts.find(p => p.type === type)?.value || "";
    return `${v("year")}-${v("month")}-${v("day")}`;
  }

  async function getSheetUpdated(){
    try{
      const res = await fetch(`${META_URL}?t=${Date.now()}`, {
        cache:"no-store"
      });
      if(!res.ok) throw new Error("meta sheet error");

      const rows = await res.json();

      const matched = rows.filter(row => {
        const name = String(row.sheet_name || row.key || row.sheet || "")
          .trim().toLowerCase();
        const gid = String(row.gid || row.sheet_id || "").trim();

        return TARGET_NAMES.includes(name) || TARGET_GIDS.includes(gid);
      });

      let dates = matched.map(parseMetaDate).filter(Boolean);

      if(!dates.length && USE_SITE_FALLBACK){
        dates = rows
          .filter(row =>
            String(row.sheet_name || row.key || row.sheet || "")
              .trim().toLowerCase() === "site"
          )
          .map(parseMetaDate)
          .filter(Boolean);
      }

      if(!dates.length) return null;
      return new Date(Math.max(...dates.map(d => d.getTime())));
    }catch(_){
      return null;
    }
  }

  async function getGitHubUpdated(){
    try{
      const api =
        `https://api.github.com/repos/sekibun-king/nagamine_mao/commits?path=${encodeURIComponent(PAGE_FILE)}&per_page=1&t=${Date.now()}`;

      const res = await fetch(api, {
        cache:"no-store",
        headers:{"Accept":"application/vnd.github+json"}
      });

      if(!res.ok) return null;
      const data = await res.json();
      const iso = data?.[0]?.commit?.committer?.date;
      if(!iso) return null;

      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }catch(_){
      return null;
    }
  }

  const [sheetDate, githubDate] = await Promise.all([
    getSheetUpdated(),
    getGitHubUpdated()
  ]);

  const dates = [sheetDate, githubDate].filter(Boolean);
  if(dates.length){
    box.textContent = formatJST(
      new Date(Math.max(...dates.map(d => d.getTime())))
    );
    return;
  }

  const fallback = new Date(document.lastModified);
  box.textContent = Number.isNaN(fallback.getTime())
    ? "—"
    : formatJST(fallback);
}
